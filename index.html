<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <title>Мои задачи</title>
  <style>
    :root{--bg:#f6f5f2;--panel:#fff;--ink:#22221f;--muted:#777770;--line:#dfded8;--accent:#176b4d;--accent-soft:#e8f2ed;--danger:#b43b32;--warn:#b86b14;--shadow:0 10px 30px rgba(35,35,30,.08);--r:14px}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100%;display:grid;grid-template-columns:236px minmax(0,1fr)}
    aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:#efeee9;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:18px;font-weight:750}.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:white;font-weight:800}.nav-label{padding:0 9px 7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;color:#55554f;display:flex;align-items:center;justify-content:space-between;min-height:42px}.nav button:hover{background:rgba(255,255,255,.58)}.nav button.active{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 0 rgba(0,0,0,.04)}.count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#deddd6;color:#62625d;display:grid;place-items:center;font-size:11px}.nav button.active .count{background:var(--accent-soft);color:var(--accent)}.sidebar-actions{margin-top:auto;display:grid;gap:8px}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:10px;padding:10px;color:#55554f;text-align:left;text-decoration:none}.ghost:hover{background:white}
    main{min-width:0;padding:22px 24px 32px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.title h1{font-size:27px;line-height:1.15;margin:0 0 6px;letter-spacing:-.025em}.title p{margin:0;color:var(--muted)}.primary{border:0;background:var(--accent);color:white;border-radius:11px;padding:11px 15px;font-weight:700;min-height:44px;box-shadow:0 5px 14px rgba(23,107,77,.2)}.primary:hover{filter:brightness(.95)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:17px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:8px 12px;color:#5d5d57;min-height:38px}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}.search{margin-left:auto;min-width:220px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;outline:none}.search:focus{border-color:#90ae9f;box-shadow:0 0 0 3px rgba(23,107,77,.09)}
    .board{display:grid;grid-template-columns:repeat(4,minmax(235px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:8px}.column{background:#ebeae5;border:1px solid #e0dfda;border-radius:var(--r);padding:11px;min-height:250px}.column-head{display:flex;justify-content:space-between;align-items:center;padding:3px 3px 11px;font-weight:750}.column-head span:last-child{font-size:11px;color:var(--muted);font-weight:600;background:#deddd7;border-radius:10px;padding:2px 7px}.cards{display:grid;gap:9px;min-height:180px}.cards.drag-over{outline:2px dashed #72a18c;outline-offset:4px;border-radius:8px}.card{background:var(--panel);border:1px solid rgba(0,0,0,.06);border-radius:11px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}.card:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(30,30,25,.08)}.card.dragging{opacity:.45}.card-title{font-weight:680;font-size:14px;line-height:1.38;margin-bottom:11px}.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:4px 7px;border-radius:7px;background:#f0f0ec;color:#62625c}.tag.high{background:#fff0e2;color:#9b5611}.tag.urgent{background:#fdecea;color:#a4352d}.due{font-size:11px;color:var(--muted);margin-left:auto}.due.overdue{color:var(--danger);font-weight:700}.empty{display:none;color:#8b8b84;text-align:center;padding:55px 20px}.empty.visible{display:block}.mobile-nav{display:none}
    dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100% - 24px));box-shadow:0 28px 80px rgba(0,0,0,.22);color:var(--ink)}dialog::backdrop{background:rgba(25,25,22,.45);backdrop-filter:blur(2px)}.modal{padding:22px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h2{margin:0;font-size:21px}.icon-btn{border:0;background:#f0f0ec;width:36px;height:36px;border-radius:10px;font-size:20px;color:#666}.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#64645e}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;background:#fff}.field textarea{min-height:84px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#80a694;box-shadow:0 0 0 3px rgba(23,107,77,.09)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:7px}.secondary{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px}.danger{margin-right:auto;border:0;background:transparent;color:var(--danger);padding:10px 0}.toast{position:fixed;right:20px;bottom:20px;background:#22221f;color:white;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:920px){.app{display:block}aside{display:none}.mobile-nav{display:flex;gap:7px;overflow:auto;margin:0 -16px 15px;padding:0 16px 3px;scrollbar-width:none}.mobile-nav button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:20px;padding:8px 12px}.mobile-nav button.active{background:var(--ink);color:#fff;border-color:var(--ink)}main{padding:18px 16px 28px}.board{grid-template-columns:repeat(4,82vw)}.search{order:3;margin-left:0;width:100%}.topbar{align-items:center}.title h1{font-size:23px}.title p{display:none}}@media(max-width:520px){.primary{padding:11px 13px}.primary .wide{display:none}.row{grid-template-columns:1fr}.modal{padding:18px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="brand-mark">✓</span> Мои задачи</div>
    <div><div class="nav-label">Оргструктура</div><nav class="nav" id="sideNav"></nav></div>
    <div class="sidebar-actions">
      <button class="ghost" id="exportBtn">↓ Скачать CSV</button>
      <a class="ghost" href="https://docs.google.com/spreadsheets/d/1jR8DYuDH7a8cxozZ_h-wE_5zxvBKUG2kA_GFt9Y_etg/edit" target="_blank" rel="noopener">↗ Google Таблица</a>
    </div>
  </aside>
  <main>
    <header class="topbar"><div class="title"><h1 id="pageTitle">Все задачи</h1><p id="summary">Личная рабочая доска</p></div><button class="primary" id="addBtn">＋ <span class="wide">Новая задача</span></button></header>
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="toolbar"><button class="chip active" data-filter="all">Все</button><button class="chip" data-filter="today">Сегодня</button><button class="chip" data-filter="overdue">Просрочено</button><input class="search" id="search" type="search" placeholder="Поиск задач…"></div>
    <section class="board" id="board"></section><div class="empty" id="empty">Задач по выбранному фильтру нет.<br>Добавьте новую или выберите другой блок.</div>
  </main>
</div>
<dialog id="taskDialog"><form class="modal" id="taskForm" method="dialog"><div class="modal-head"><h2 id="modalTitle">Новая задача</h2><button class="icon-btn" type="button" id="closeBtn" aria-label="Закрыть">×</button></div><div class="form">
  <div class="field"><label for="taskTitle">Что нужно сделать</label><input id="taskTitle" required maxlength="160" autocomplete="off"></div>
  <div class="row"><div class="field"><label for="taskOrg">Блок</label><select id="taskOrg"></select></div><div class="field"><label for="taskStatus">Статус</label><select id="taskStatus"></select></div></div>
  <div class="row"><div class="field"><label for="taskPriority">Приоритет</label><select id="taskPriority"><option>Обычный</option><option>Важный</option><option>Срочный</option></select></div><div class="field"><label for="taskDue">Срок</label><input id="taskDue" type="date"></div></div>
  <div class="field"><label for="taskNote">Комментарий</label><textarea id="taskNote" maxlength="800"></textarea></div>
  <div class="modal-actions"><button class="danger" id="deleteBtn" type="button">Удалить</button><button class="secondary" type="button" id="cancelBtn">Отмена</button><button class="primary" type="submit">Сохранить</button></div>
</div></form></dialog>
<div class="toast" id="toast"></div>
<script>
const ORGS=['Личное','Продажи','Маркетинг','Найм','Финансы','IT / Битрикс24','Операционная деятельность'];
const STATUSES=['Входящие','Запланировано','В работе','Ожидает'];
const KEY='sergey_task_board_v1';
const initial=[];
const INBOX_SEED_KEY='sergey_tasks_seed_2026_09_03_2';
const inboxSeed=[
  {id:'task-org-platrum',title:'Сделать оргструктуру в Platrum',org:'Операционная деятельность',status:'Входящие',priority:'Обычный',due:'',note:'',created:new Date().toISOString(),updated:new Date().toISOString()},
  {id:'task-sales-process',title:'Описать бизнес-процесс компании от лида до продажи',org:'Продажи',status:'Входящие',priority:'Обычный',due:'',note:'',created:new Date().toISOString(),updated:new Date().toISOString()},
  {id:'task-manager-estimator-handoff',title:'Настроить передачу от менеджеров к сметчику и контроль процесса',org:'Продажи',status:'Входящие',priority:'Обычный',due:'',note:'',created:new Date().toISOString(),updated:new Date().toISOString()}
];
let tasks=load(),activeOrg='Все задачи',activeFilter='all',editingId=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function load(){
  let stored=[];
  try{stored=JSON.parse(localStorage.getItem(KEY))||[]}catch{}
  stored=stored.filter(t=>t.id!=='demo-1');
  if(!localStorage.getItem(INBOX_SEED_KEY)){
    for(const task of inboxSeed)if(!stored.some(t=>t.id===task.id||t.title===task.title))stored.push(task);
    localStorage.setItem(KEY,JSON.stringify(stored));
    localStorage.setItem(INBOX_SEED_KEY,'1');
  }
  return stored.length?stored:initial;
}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function visible(t){if(activeOrg!=='Все задачи'&&t.org!==activeOrg)return false;const q=$('#search').value.trim().toLowerCase();if(q&&!(`${t.title} ${t.note||''} ${t.org}`).toLowerCase().includes(q))return false;if(activeFilter==='today')return t.due===today();if(activeFilter==='overdue')return t.due&&t.due<today();return true}
function navButton(name,mobile=false){const n=tasks.filter(t=>name==='Все задачи'||t.org===name).length;return `<button data-org="${name}" class="${name===activeOrg?'active':''}"><span>${name}</span>${mobile?'':`<span class="count">${n}</span>`}</button>`}
function renderNav(){const names=['Все задачи',...ORGS];$('#sideNav').innerHTML=names.map(n=>navButton(n)).join('');$('#mobileNav').innerHTML=names.map(n=>navButton(n,true)).join('');$$('[data-org]').forEach(b=>b.onclick=()=>{activeOrg=b.dataset.org;render()})}
function formatDue(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}.${m}`}
function card(t){const p=t.priority==='Срочный'?'urgent':t.priority==='Важный'?'high':'';const overdue=t.due&&t.due<today();return `<article class="card" draggable="true" data-id="${t.id}" tabindex="0"><div class="card-title">${esc(t.title)}</div><div class="meta"><span class="tag">${esc(t.org)}</span>${t.priority!=='Обычный'?`<span class="tag ${p}">${t.priority}</span>`:''}${t.due?`<span class="due ${overdue?'overdue':''}">${overdue?'Просрочено · ':''}${formatDue(t.due)}</span>`:''}</div></article>`}
function render(){renderNav();$('#pageTitle').textContent=activeOrg;const shown=tasks.filter(visible);$('#summary').textContent=`${shown.length} ${word(shown.length)} · данные сохраняются в этом браузере`;$('#board').innerHTML=STATUSES.map(s=>{const list=shown.filter(t=>t.status===s);return `<section class="column"><div class="column-head"><span>${s}</span><span>${list.length}</span></div><div class="cards" data-status="${s}">${list.map(card).join('')}</div></section>`}).join('');$('#empty').classList.toggle('visible',shown.length===0);bindCards()}
function word(n){const x=n%10,y=n%100;return x===1&&y!==11?'задача':x>=2&&x<=4&&(y<12||y>14)?'задачи':'задач'}
function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function bindCards(){$$('.card').forEach(c=>{c.onclick=()=>openEdit(c.dataset.id);c.onkeydown=e=>{if(e.key==='Enter')openEdit(c.dataset.id)};c.ondragstart=e=>{c.classList.add('dragging');e.dataTransfer.setData('text/plain',c.dataset.id)};c.ondragend=()=>c.classList.remove('dragging')});$$('.cards').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('drag-over')};z.ondragleave=()=>z.classList.remove('drag-over');z.ondrop=e=>{e.preventDefault();z.classList.remove('drag-over');const t=tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.status=z.dataset.status;t.updated=new Date().toISOString();save();render();toast('Статус изменён')}}})}
function fillSelects(){const org=$('#taskOrg'),status=$('#taskStatus');org.innerHTML=ORGS.map(x=>`<option>${x}</option>`).join('');status.innerHTML=STATUSES.map(x=>`<option>${x}</option>`).join('')}
function openNew(){editingId=null;$('#modalTitle').textContent='Новая задача';$('#taskForm').reset();$('#taskOrg').value=activeOrg==='Все задачи'?'Личное':activeOrg;$('#taskStatus').value='Входящие';$('#deleteBtn').style.display='none';$('#taskDialog').showModal();setTimeout(()=>$('#taskTitle').focus(),30)}
function openEdit(id){const t=tasks.find(x=>x.id===id);if(!t)return;editingId=id;$('#modalTitle').textContent='Задача';$('#taskTitle').value=t.title;$('#taskOrg').value=t.org;$('#taskStatus').value=t.status;$('#taskPriority').value=t.priority;$('#taskDue').value=t.due||'';$('#taskNote').value=t.note||'';$('#deleteBtn').style.display='block';$('#taskDialog').showModal()}
function close(){if($('#taskDialog').open)$('#taskDialog').close()}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function exportCSV(){const rows=[['ID','Задача','Блок','Статус','Приоритет','Срок','Комментарий','Создано','Изменено'],...tasks.map(t=>[t.id,t.title,t.org,t.status,t.priority,t.due,t.note,t.created,t.updated])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='мои-задачи.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV скачан')}
fillSelects();render();
$('#addBtn').onclick=openNew;$('#closeBtn').onclick=close;$('#cancelBtn').onclick=close;$('#exportBtn').onclick=exportCSV;$('#search').oninput=render;$$('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#taskForm').onsubmit=e=>{e.preventDefault();const now=new Date().toISOString();const data={title:$('#taskTitle').value.trim(),org:$('#taskOrg').value,status:$('#taskStatus').value,priority:$('#taskPriority').value,due:$('#taskDue').value,note:$('#taskNote').value.trim(),updated:now};if(!data.title)return;if(editingId){Object.assign(tasks.find(x=>x.id===editingId),data)}else{tasks.unshift({id:(crypto.randomUUID?.()||Date.now().toString()),created:now,...data})}save();close();render();toast('Задача сохранена')};
$('#deleteBtn').onclick=()=>{if(editingId&&confirm('Удалить эту задачу?')){tasks=tasks.filter(t=>t.id!==editingId);save();close();render();toast('Задача удалена')}};
</script>
</body>
</html>
